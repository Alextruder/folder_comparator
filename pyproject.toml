# Configuration des outils de développement uniquement : le programme n'a aucune dépendance.
[project]
name = "folder_comparator"
version = "0.1.0"
description = "Vérifie que chaque photo brute a sa version retouchée."
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH"]

[tool.mypy]
python_version = "3.13"
files = ["folder_comparator", "tests", ".claude/hooks"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
